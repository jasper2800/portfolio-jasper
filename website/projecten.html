<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Een overzicht van de projecten van Jasper Van Laere.">
    <title>Projecten - Jasper Van Laere</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --donkerblauw: #1d3557;
            --tekst: #172033;
            --oranje: #ff7043;
            --achtergrond: #f2f6fa;
            --wit: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 16px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: var(--tekst);
            background-color: var(--achtergrond);
        }

        header,
        section {
            border-radius: 12px;
        }

        header {
            padding: 32px 24px;
            color: var(--wit);
            background-color: var(--donkerblauw);
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            color: var(--oranje);
        }

        h2 {
            color: var(--donkerblauw);
            border-bottom: 2px solid var(--oranje);
            padding-bottom: 5px;
        }

        nav {
            margin-top: 24px;
        }

        nav ul {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        a {
            color: var(--donkerblauw);
        }

        nav a {
            color: var(--wit);
            font-weight: bold;
        }

        a:hover {
            color: var(--oranje);
        }

        a:focus-visible {
            outline: 3px solid var(--oranje);
            outline-offset: 3px;
        }

        nav a[aria-current="page"] {
            color: var(--oranje);
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        main {
            margin-top: 30px;
        }

        section {
            padding: 24px;
            margin-bottom: 24px;
            background-color: var(--wit);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        article {
            padding: 20px;
            border: 1px solid #d9e1eb;
            border-radius: 10px;
            background-color: #fbfcfe;
        }

        article:hover {
            border-color: #ff7043;
        }

        article img {
            display: block;
            width: 100%;
            height: auto;
            margin: 16px 0;
            border-radius: 8px;
        }

        article h2 {
            font-size: 1.35rem;
        }

        .project-link {
            display: inline-block;
            margin-top: 8px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            header,
            section {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Mijn projecten</h1>
        <p>Een overzicht van mijn projecten en oefeningen.</p>

        <nav aria-label="Hoofdnavigatie">
            <ul>
                <li><a href="index.html">Over mij</a></li>
                <li><a href="projecten.html">Projecten</a></li>
                <li><a href="werkplekleren.html">Werkplekleren</a></li>
                <li><a href="CV.html">CV</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="projecten-titel">
            <h2 id="projecten-titel">Mijn projecten</h2>

            <div class="project-grid">
                <article>
                    <h2>Portfolio website</h2>

                    <img src="media/html-css.jpg" alt="HTML- en CSS-logo" width="600" height="338">
                    <p>
                        Mijn eerste portfolio website, gemaakt met HTML en CSS
                        voor het vak User Interfaces.
                    </p>

                    <a class="project-link" href="project-portfolio.html">
                        Bekijk het project
                    </a>
                </article>
            </div>
        </section>
    </main>
</body>

</html>
